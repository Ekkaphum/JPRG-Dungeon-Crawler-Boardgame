server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static assets (webp/js/css) are content-hashed by Vite — safe to cache hard.
    location ~* \.(?:webp|png|jpg|jpeg|svg|js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — this is a client-side-only router (no server), so every unknown path
    # serves index.html and React takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
